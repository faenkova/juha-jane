/* ─── TIMES ─── */
function getTimes() {
  const now = new Date();
  const moscowTime = new Date(now.toLocaleString("en-US",{timeZone:"Europe/Moscow"}));
  const londonTime = new Date(now.toLocaleString("en-US",{timeZone:"Europe/London"}));
  const fmt = d => d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  const diff = Math.round((moscowTime - londonTime) / 3600000);
  return {moscow: fmt(moscowTime), london: fmt(londonTime), diff};
}
function daysUntil(dateStr) {
  const target = new Date(dateStr);
  const now = new Date();
  now.setHours(0,0,0,0); target.setHours(0,0,0,0);
  return Math.max(0, Math.round((target - now) / 86400000));

/* ─── TICKER ─── */
function TickerBar({streak, activityCount}) {
  const {moscow, london, diff} = getTimes();
  const now2 = new Date();
  const tgt = new Date("2026-06-14"); tgt.setHours(0,0,0,0);
  const totalH = Math.max(0,Math.floor((tgt-now2)/3600000));
  const dL = Math.floor(totalH/24), hL = totalH%24;
  const items = [
    {e:"💑",l:"Love Rate",       v:"∞",              c:"▲",    up:true},
    {e:"✈️",l:"Moscow → London", v:"2,513 km",       c:"",     up:null},
    {e:"🕐",l:"Moscow",          v:moscow,            c:`+${diff}h vs LDN`, up:null},
    {e:"🕑",l:"London",          v:london,            c:"",     up:null},
    {e:"📅",l:"Next visit",      v:`${dL}d ${String(hL).padStart(2,"0")}h`, c:"Jun 14 ✈️",up:null},
    {e:"⚡",l:"Activity",        v:`${activityCount||0}`, c:"actions", up:null},
    {e:"🔥",l:"Streak",          v:`${streak||0} days`, c:"",up:null},
  ];
  const all=[...items,...items,...items];
  return (
    <div className="ticker-wrap">
      <div style={{display:"flex",gap:44,whiteSpace:"nowrap",animation:"ticker 42s linear infinite",paddingLeft:"100%",alignItems:"center"}}>
        {all.map((t,i)=>(
          <span key={i} className="mono" style={{fontSize:10,display:"inline-flex",gap:5,alignItems:"center"}}>
            <span>{t.e}</span>
            <span style={{color:"rgba(255,255,255,.3)"}}>{t.l}</span>
            <span style={{color:"rgba(255,255,255,.75)",fontWeight:600}}>{t.v}</span>
            {t.c&&<span style={{color:"rgba(255,255,255,.35)",fontSize:9}}>{t.c}</span>}
            <span style={{color:"rgba(255,255,255,.1)",marginLeft:6}}>·</span>
          </span>
        ))}
      </div>
    </div>
  );
}

/* ─── MODAL ─── */
function Modal({open,title,sub,body,onClose,onConfirm,confirmLabel="Confirm",confirmColor}) {
  if(!open) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div style={{width:36,height:4,background:C.line2,borderRadius:99,margin:"0 auto 22px"}}/>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:19,fontWeight:700,marginBottom:sub?4:0}}>{title}</div>
          {sub&&<div className="mono" style={{fontSize:11,color:C.muted}}>{sub}</div>}
        </div>
        {body&&<div style={{color:C.muted,fontSize:14,textAlign:"center",lineHeight:1.65,marginBottom:22}}>{body}</div>}
        <div style={{display:"flex",gap:10}}>
          <button className="btn-ghost" onClick={onClose} style={{flex:1,padding:"13px 0",borderRadius:12,fontSize:14}}>Cancel</button>
          <button onClick={onConfirm} style={{flex:1,padding:"13px 0",fontSize:14,fontWeight:700,background:confirmColor||C.indigo,border:"none",borderRadius:12,color:"#fff"}}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function Toast({msg,phase}) {
  if(!msg) return null;
  return <div className={`toast-el ${phase}`}>{msg}</div>;
}

/* ─── PASSWORD GATE ─── */
function LockScreen({onUnlock}) {
  const [val,setVal] = useState("");
  const [shake,setShake] = useState(false);
  const [hint,setHint] = useState("");

  const tryUnlock = () => {
    if(val.trim().toLowerCase()===APP_PASSWORD.toLowerCase()){
      try{localStorage.setItem("rba_auth","ok")}catch{}
      onUnlock();
    } else {
      setShake(true); setHint("Wrong password. Try again 💛");
      setTimeout(()=>setShake(false),450);
      setTimeout(()=>setHint(""),2000);
    }
  };

  return (
    <div className="lock-screen">
      <div className="lock-box">
        <div style={{fontSize:48,marginBottom:14}} className="heart">💑</div>
        <div style={{fontSize:20,fontWeight:800,color:C.text,marginBottom:6}}>Us</div>
        <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:4}}>Juha & Jane · a private space</div>
        <div style={{fontSize:11,color:C.dim,marginBottom:4}}>Enter the password to continue</div>
        <input
          className={`lock-input${shake?" shake":""}`}
          type="password"
          placeholder="password"
          value={val}
          onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&tryUnlock()}
          autoFocus
        />
        {hint&&<div style={{fontSize:12,color:C.red,marginBottom:12}}>{hint}</div>}
        <button className="lock-btn" onClick={tryUnlock}>Enter →</button>
        <div style={{marginTop:16,fontSize:11,color:C.dim}}>Only the two of you know this.</div>
      </div>
    </div>
  );
}

        setMDone(d.mDone||false);
      }
      setLoading(false); setSynced(true);
    }, ()=>{setLoading(false);setSynced(false);});
    return()=>unsub();
  },[unlocked]);

  /* ── Daily mission reset ── */

      setToast(t=>({...t,phase:"out"}));
      setTimeout(()=>setToast({msg:"",phase:""}),300);
    },2400);
  };

  const updateRoom=patch=>db.collection("rooms").doc(ROOM_ID).set(patch,{merge:true});
  const incActivity=()=>updateRoom({activityCount:(activityCount||0)+1});

    return (
      <div className="section-wrap" style={{paddingTop:20}}>
        <div style={{marginBottom:18,padding:"16px",background:`linear-gradient(135deg,rgba(251,115,22,.1),rgba(251,115,22,.04))`,border:`1.5px solid rgba(251,115,22,.3)`,borderRadius:16}}>
          <div style={{fontSize:10,color:C.orange,fontWeight:600,letterSpacing:2,marginBottom:8}}>HONEST NOTE</div>
          <div style={{fontSize:14,color:C.text,lineHeight:1.7}}>Orthodox and LDS are <span style={{color:C.orange,fontWeight:600}}>genuinely different</span> in theology and practice. That's not a problem — but it needs real conversations. This space is for those.</div>
        </div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:14}}>✝️ Faith & family</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
          {topics.map(t=>{
            const key=`faith_${t.id}`;
            const note=fd[key]||"";
            const isOpen=activeTopic===t.id;
            return (
              <div key={t.id} style={{background:C.bg2,border:`1.5px solid ${note?"rgba(251,115,22,.4)":C.line}`,borderRadius:14,overflow:"hidden"}}>
                <button onClick={()=>setActiveTopic(isOpen?null:t.id)} style={{width:"100%",padding:"14px 16px",background:"transparent",border:"none",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                  <span style={{fontSize:22,flexShrink:0}}>{t.e}</span>
                  <div style={{flex:1,textAlign:"left"}}>
                    <div style={{fontSize:14,fontWeight:600,color:C.text}}>{t.label}</div>
                    <div style={{fontSize:12,color:C.muted,marginTop:1}}>{t.q}</div>
                  </div>
                  <div style={{fontSize:12,color:note?C.orange:C.dim,flexShrink:0}}>{note?"✍️":"○"}</div>
                </button>
                {isOpen&&(
                  <div style={{padding:"0 16px 16px"}}>
                    <textarea className="tension-input" style={{borderColor:"rgba(251,115,22,.4)"}} rows={3}
                      placeholder="Write what you've discussed or decided..."
                      defaultValue={note}
                      onFocus={()=>{isTyping.current=true}}
                      onBlur={e=>{isTyping.current=false; updateRoom({[key]:e.target.value})}}/>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div style={{background:C.bg2,border:`1.5px solid ${C.line}`,borderRadius:16,padding:"16px"}}>
          <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:C.muted}}>Our shared intention</div>
          <div style={{fontSize:12,color:C.dim,marginBottom:10,lineHeight:1.5}}>What do you both believe about your relationship — regardless of denomination?</div>
          <textarea className="tension-input" rows={3}
            placeholder="e.g. We both believe our relationship is guided by something bigger than us..."
            defaultValue={fd.sharedFaith||""}
            onFocus={()=>{isTyping.current=true}}
            onBlur={e=>{isTyping.current=false; updateRoom({sharedFaith:e.target.value})}}/>
        </div>
      </div>
    );
}

/* ── LOVE LANGUAGES ── */
function LoveSection() {
    const {fd, updateRoom} = useContext(Ctx);
    const langs = [
      {id:"words",  e:"💬",t:"Words of affirmation",d:"Feeling loved through compliments, 'I love you', appreciation in words"},
      {id:"time",   e:"⏱️",t:"Quality time",        d:"Feeling loved through undivided attention, focused presence, shared experiences"},
      {id:"touch",  e:"🤝",t:"Physical touch",      d:"Feeling loved through physical closeness, hugs, holding hands, presence"},
      {id:"gifts",  e:"🎁",t:"Gifts",               d:"Feeling loved through thoughtful gestures, surprises, tokens of being thought of"},
      {id:"service",e:"🛠️",t:"Acts of service",     d:"Feeling loved through practical help, doing things for each other, care"},
    ];
    const juhaL=fd.juhaLang||null, juhaL2=fd.juhaLang2||null;
    const janeL=fd.janeLang||null, janeL2=fd.janeLang2||null;
    return (
      <div className="section-wrap" style={{paddingTop:20}}>
        <div style={{marginBottom:18,padding:"16px",background:`linear-gradient(135deg,rgba(244,114,182,.1),rgba(244,114,182,.04))`,border:`1.5px solid rgba(244,114,182,.3)`,borderRadius:16}}>
          <div style={{fontSize:10,color:C.pink,fontWeight:600,letterSpacing:2,marginBottom:8}}>WHY THIS MATTERS ON DISTANCE</div>
          <div style={{fontSize:14,color:C.text,lineHeight:1.7}}>Physical touch is mostly unavailable at distance. If that's your primary love language, you need to know it — and find ways to meet each other through the others. <span style={{color:C.pink,fontWeight:600}}>Knowing this changes how you love each other every day.</span></div>
        </div>
        <div style={{fontSize:15,fontWeight:700,marginBottom:6}}>💕 Love languages</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Select primary then secondary. Tap to deselect.</div>
        {[["h","🦅 Juha","juhaLang","juhaLang2",[juhaL,juhaL2]],["w","🌸 Jane","janeLang","janeLang2",[janeL,janeL2]]].map(([who,name,pk,sk,sel])=>(
          <div key={who} style={{marginBottom:20}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:10,color:who==="h"?C.indigo:C.pink}}>{name}</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {langs.map(l=>{
                const isPrimary=sel[0]===l.id, isSecond=sel[1]===l.id;
                return (
                  <button key={l.id} className={`lang-card${isPrimary||isSecond?" selected":""}`}
                    style={{borderColor:isPrimary?(who==="h"?C.indigo:C.pink):isSecond?"rgba(244,114,182,.4)":C.line}}
                    onClick={()=>{
                      if(!sel[0]) updateRoom({[pk]:l.id});
                      else if(sel[0]===l.id) updateRoom({[pk]:null,[sk]:null});
                      else if(!sel[1]) updateRoom({[sk]:l.id});
                      else if(sel[1]===l.id) updateRoom({[sk]:null});
                      else updateRoom({[pk]:l.id,[sk]:null});
                    }}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:20}}>{l.e}</span>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:600,color:C.text}}>{l.t}</div>
                        <div style={{fontSize:12,color:C.muted,marginTop:1}}>{l.d}</div>
                      </div>
                      {isPrimary&&<span style={{fontSize:10,fontWeight:700,color:who==="h"?C.indigo:C.pink,background:`rgba(${who==="h"?"129,140,248":"244,114,182"},.15)`,padding:"3px 8px",borderRadius:20,flexShrink:0}}>PRIMARY</span>}
                      {isSecond&&<span style={{fontSize:10,fontWeight:700,color:C.muted,background:C.bg3,padding:"3px 8px",borderRadius:20,flexShrink:0}}>2ND</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        ))}
        {juhaL&&janeL&&(
          <div style={{background:`linear-gradient(135deg,rgba(244,114,182,.1),rgba(129,140,248,.08))`,border:`1.5px solid rgba(244,114,182,.3)`,borderRadius:16,padding:"16px",textAlign:"center"}}>
            <div style={{fontSize:10,color:C.pink,fontWeight:600,letterSpacing:2,marginBottom:10}}>YOUR MATCH</div>
            <div style={{fontSize:14,color:C.text,lineHeight:1.8}}>
              Juha feels most loved through <span style={{color:C.indigo,fontWeight:600}}>{langs.find(l=>l.id===juhaL)?.t}</span>{juhaL2&&<span style={{color:C.dim}}> + {langs.find(l=>l.id===juhaL2)?.t}</span>}.<br/>
              Jane feels most loved through <span style={{color:C.pink,fontWeight:600}}>{langs.find(l=>l.id===janeL)?.t}</span>{janeL2&&<span style={{color:C.dim}}> + {langs.find(l=>l.id===janeL2)?.t}</span>}.
            </div>
          </div>
        )}
      </div>
    );
}

/* ── HONEST SPACE ── */
function HonestSection() {
    const {fd, activityCount, updateRoom} = useContext(Ctx);
    const [who,setWho]   = useState("h");
    const [text,setText] = useState("");
    const [saving,setSaving] = useState(false);
    const notes = fd.honestNotes||[];
    const submit = () => {
      if(!text.trim()) return;
      const entry={id:Date.now(),who,text:text.trim(),time:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),date:new Date().toLocaleDateString("en-GB")};
      updateRoom({honestNotes:[entry,...notes],activityCount:(activityCount||0)+1});
      setText(""); setSaving(true);
      setTimeout(()=>setSaving(false),1200);
    };
    const prompts = [
      "Something I haven't said because I wasn't sure how you'd take it…",
      "Something the distance makes really hard for me right now…",
      "Something I want physically that I can't have right now…",
      "A fear I have about us that I haven't fully admitted…",
      "Something I need more of from you, even though it's hard to ask…",
      "A moment recently when I felt really close to you…",
      "Something I'm proud of about how far we've come…",
      "Something about waiting that I find hard to talk about…",
    ];
    return (
      <div className="section-wrap" style={{paddingTop:20}}>
        <div style={{marginBottom:18,padding:"16px",background:`linear-gradient(135deg,rgba(255,92,92,.1),rgba(255,92,92,.04))`,border:`1.5px solid rgba(255,92,92,.3)`,borderRadius:16}}>
          <div style={{fontSize:10,color:C.red,fontWeight:600,letterSpacing:2,marginBottom:8}}>WHAT THIS IS FOR</div>
          <div style={{fontSize:14,color:C.text,lineHeight:1.7}}>A private space for things that are <span style={{color:C.red,fontWeight:600}}>hard to say out loud</span>. Longing, tension, fear, desire — the things that accumulate when you're apart. Nothing here is wrong. Silence is the only danger.</div>
        </div>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10,color:C.muted}}>Starting points — tap to use</div>
        <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8,marginBottom:16}}>
          {prompts.map((p,i)=>(
            <button key={i} onClick={()=>setText(p)} style={{flexShrink:0,maxWidth:190,padding:"10px 12px",background:C.bg2,border:`1.5px solid ${C.line}`,borderRadius:12,fontSize:12,color:C.muted,textAlign:"left",lineHeight:1.4,cursor:"pointer"}}>
              {p}
            </button>
          ))}
        </div>
        <div style={{background:C.bg2,border:`1.5px solid ${C.line}`,borderRadius:18,padding:"18px 16px",marginBottom:20}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Write it down</div>
          <div className="seg-wrap" style={{marginBottom:12}}>
            <button className={`seg-btn${who==="h"?" active":""}`} onClick={()=>setWho("h")}>🦅 Juha</button>
            <button className={`seg-btn${who==="w"?" active":""}`} onClick={()=>setWho("w")}>🌸 Jane</button>
          </div>
          <textarea className="tension-input" rows={4} placeholder="Say the thing you haven't said yet. This is a safe space." value={text} onChange={e=>setText(e.target.value)}/>
          <button className="btn-primary"
            style={{marginTop:12,background:`linear-gradient(135deg,${C.red},#c0392b)`,boxShadow:"0 4px 18px rgba(255,92,92,.2)",opacity:text.trim()&&!saving?1:.5}}
            disabled={!text.trim()||saving} onClick={submit}>
            {saving?"Saved ✓":"Say it →"}
          </button>
        </div>
        {notes.length>0&&(
          <div>
            <div style={{fontSize:12,fontWeight:600,marginBottom:10,color:C.muted}}>What's been said</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {notes.map(n=>(
                <div key={n.id} style={{background:C.bg2,border:`1.5px solid rgba(255,92,92,.2)`,borderRadius:14,padding:"14px 16px"}}>
                  <div style={{fontSize:13,color:C.text,fontWeight:500,lineHeight:1.6,marginBottom:8}}>{n.text}</div>
                  <div className="mono" style={{fontSize:10,color:C.dim}}>{n.who==="h"?"🦅 Juha":"🌸 Jane"} · {n.time} · {n.date}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
